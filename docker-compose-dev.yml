services:
  mysql-db:
    image: mysql:8.0
    container_name: global_tech_mysql
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: global_tech
    ports:
      - "3306:3306"
    volumes:
      - /data/Programming/postgresql/data:/var/lib/postgresql/data

  redis-cache:
    image: redis:7-alpine
    container_name: global_tech_redis
    restart: on-failure
    ports:
      - "6379:6379"
